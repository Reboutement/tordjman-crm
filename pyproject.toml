[project]
name = "tordjman_crm"
authors = [{ name = "Reboutement et Massage", email = "contact@formationreboutement.fr" }]
description = "Modèle de données et API du CRM Reboutement et Massage / French Body Reset, au-dessus de Frappe CRM."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
crm = ">=1.89.0,<2.0.0"

[tool.ruff]
line-length = 110
